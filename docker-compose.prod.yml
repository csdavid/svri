version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: svri-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: svri_user
      POSTGRES_PASSWORD: svri_password_prod_secure123
      POSTGRES_DB: svri_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backend/app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - svri-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: svri-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://svri_user:svri_password_prod_secure123@db:5432/svri_db
    depends_on:
      - db
    command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:8008
    networks:
      - svri-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: svri-frontend-prod
    restart: always
    networks:
      - svri-network

  nginx:
    image: nginx:alpine
    container_name: svri-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - svri-network

networks:
  svri-network:
    driver: bridge

volumes:
  postgres_prod_data:
